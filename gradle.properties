# Gradle Daemon 与构建性能优化
# 堆按工程规模给到 8g 即可；Metaspace 与堆独立，给足不会常驻占用，
# 上限过低会在 AGP + R8 + Lint 同时加载类时耗尽并强制重启 daemon
org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=2048m
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存条目每轮都因内部 tmp 文件消失而判定失效，复用从未命中，开启只多出写入开销

# Kotlin 编译优化
# 编译守护进程独立于 Gradle daemon，不显式限额时会继承上面的堆与非堆上限
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
